services:
  postgres:
    image: postgres:16
    container_name: pneumodetect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pneumodetect
      POSTGRES_PASSWORD: pneumodetect_dev_pw
      POSTGRES_DB: pneumodetect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: