services:
  postgres:
    image: postgres:16
    container_name: pneumodetect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pneumodetect
      POSTGRES_PASSWORD: pneumodetect_dev_pw
      POSTGRES_DB: pneumodetect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pneumodetect"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pneumodetect-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://pneumodetect:pneumodetect_dev_pw@postgres:5432/pneumodetect
      CHECKPOINT_PATH: /app/model/checkpoints/best_model.pth
    ports:
      - "8000:8000"
    volumes:
      - ./model/checkpoints:/app/model/checkpoints:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
